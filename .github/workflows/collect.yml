name: collect

on:
  schedule:
    - cron: '*/10 * * * *'   # 10분마다 (GitHub 사정으로 지연될 수 있음)
  workflow_dispatch:          # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 수집 · 알림
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/run.js
      - name: 변경분 커밋
        run: |
          git config user.name "deal-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/deals.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "update deals [skip ci]"
          git pull --rebase -X theirs || true
          git push
