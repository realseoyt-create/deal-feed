<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>꿀딜 피드</title>
<meta name="robots" content="noindex">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--text:#16191d;--muted:#6b7380;--line:#e3e6ea;--soft:#eef0f3;
  --navy:#1F3A5F;--accent:#2A9D8F;
  --t1:#e5262b;--t1bg:#fff0f0;   /* 역대급 40%+ */
  --t2:#f06a12;--t2bg:#fff4ec;   /* 대박 20%+ */
  --t3:#14a05b;--t3bg:#ecf9f2;   /* 싸다 10%+ */
  --t4:#6b7380;--t4bg:#f1f2f4;   /* 비슷/비쌈 */
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1114;--card:#191c21;--text:#eceef1;--muted:#9aa1ab;--line:#2a2e35;--soft:#22262c;
  --navy:#a9c7ea;--accent:#3cc2b2;
  --t1:#ff5a5f;--t1bg:#3a1517;--t2:#ff8f45;--t2bg:#3a2313;--t3:#3fd18a;--t3bg:#123222;--t4:#9aa1ab;--t4bg:#22262c;
}}
*{box-sizing:border-box}
body{margin:0;font-family:Pretendard,system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
a{color:inherit}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;z-index:5}
.wrap{max-width:980px;margin:0 auto}
.top{display:flex;align-items:baseline;gap:12px}
h1{font-size:21px;margin:0;color:var(--navy);font-weight:800}
.meta{color:var(--muted);font-size:13px;margin-left:auto;text-align:right}
.meta b{color:var(--t1)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
input,select,button{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
input[type=search]{flex:1;min-width:150px}
input[type=number]{width:120px}
#fbtn{display:none;cursor:pointer;white-space:nowrap}
label.tog{display:flex;align-items:center;gap:5px;font-size:14px;white-space:nowrap}
label.tog input{padding:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{padding:5px 11px;border-radius:999px;border:1px solid var(--line);font-size:13px;cursor:pointer;background:var(--card);white-space:nowrap}
.chip.on{background:var(--navy);color:var(--card);border-color:var(--navy)}
main{padding:16px 16px 40px}

/* 알림 조건 */
details.ainfo{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:18px;font-size:13px}
details.ainfo summary{cursor:pointer;font-weight:700}
details.ainfo .kv{margin-top:8px;line-height:1.8;color:var(--muted)}
details.ainfo .kv b{color:var(--text)}
details.ainfo .tag{display:inline-block;background:var(--soft);border-radius:6px;padding:1px 7px;margin:0 3px 3px 0;color:var(--text)}
details.ainfo a{color:var(--accent);font-weight:700}

/* 텔레그램 구독 */
.tgbtn{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;background:#229ED9;color:#fff;text-decoration:none;font-size:13px;font-weight:800;padding:7px 12px;border-radius:999px;align-self:center}
.tgbtn:hover{filter:brightness(1.08)}
.subcard{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.subcard .ic{font-size:30px}
.subcard .tx{flex:1;min-width:0;font-size:13px;color:var(--muted);line-height:1.5}
.subcard .tx b{display:block;color:var(--text);font-size:15px;margin-bottom:2px}
.subcard .x{background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 6px}
.steps{margin:6px 0 0;padding-left:18px}
@media (max-width:600px){.tgbtn span{display:none}.subcard{flex-wrap:wrap}}

/* 설정 편집 */
.sform{display:grid;gap:12px;margin-top:12px}
.sform .f{display:grid;gap:5px}
.sform label.t{font-weight:700;color:var(--text);font-size:13px}
.sform .hint{font-size:12px;color:var(--muted)}
.sform input[type=text],.sform input[type=number],.sform input[type=password]{width:100%}
.sform .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sform .row input[type=number]{width:90px}
.catpick{display:flex;flex-wrap:wrap;gap:6px}
.catpick label{display:flex;align-items:center;gap:4px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:13px;color:var(--text)}
.catpick input{padding:0}
.btn{cursor:pointer;font-weight:700}
.btn.primary{background:var(--navy);color:var(--card);border-color:var(--navy)}
.smsg{font-size:13px;font-weight:700}
.smsg.ok{color:var(--t3)}.smsg.err{color:var(--t1)}
.tokbox{border-top:1px dashed var(--line);padding-top:10px}
/* AI 추천 대체 카드 */
.hscore{font-size:46px;line-height:1;font-weight:900;color:#7b2ff7;letter-spacing:-1px}
.hscore small{font-size:16px;margin-left:3px;letter-spacing:0}

/* ===== 대박딜 히어로 ===== */
.hero h2{font-size:17px;margin:0 0 10px;font-weight:800}
.hero-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:26px}
.hcard{position:relative;display:block;text-decoration:none;background:var(--card);border-radius:16px;padding:18px 18px 16px;border:2px solid var(--tc);overflow:hidden}
.hcard::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,var(--tbg) 0%,transparent 70%);pointer-events:none}
.hcard > *{position:relative}
.hpct{font-size:54px;line-height:1;font-weight:900;color:var(--tc);letter-spacing:-2px}
.hpct small{font-size:22px;letter-spacing:0;margin-left:2px}
.htier{display:inline-block;font-size:12px;font-weight:800;color:#fff;background:var(--tc);padding:3px 8px;border-radius:6px;margin-left:8px;vertical-align:14px}
.hname{font-weight:700;margin:12px 0 10px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hprice{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.hprice b{font-size:24px;font-weight:900}
.strike{color:var(--muted);text-decoration:line-through;font-size:14px}
.save{display:inline-block;margin-top:10px;font-size:13px;font-weight:800;color:var(--tc);background:var(--tbg);padding:4px 10px;border-radius:999px}
.hcmp{font-size:12px;color:var(--muted);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ===== 리스트 카드 ===== */
.deal{position:relative;display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;align-items:stretch}
.deal.has{border-color:color-mix(in srgb,var(--tc) 45%,var(--line))}
.deal.new::after{content:"NEW";position:absolute;top:-7px;right:12px;font-size:10px;font-weight:800;color:#fff;background:var(--t1);padding:1px 6px;border-radius:6px}
.badge{flex:0 0 78px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--tbg);color:var(--tc);text-align:center;padding:6px 2px}
.badge .p{font-size:26px;font-weight:900;line-height:1;letter-spacing:-1px}
.badge .l{font-size:11px;font-weight:800;margin-top:4px}
.body{flex:1;min-width:0}
.row1{display:flex;gap:8px;align-items:baseline}
.mall{font-size:12px;color:var(--accent);font-weight:800;white-space:nowrap}
a.prod{font-weight:600;flex:1;line-height:1.4;text-decoration:none;min-width:0}
a.prod:hover{text-decoration:underline}
.prices{display:flex;align-items:baseline;gap:8px;margin-top:6px;flex-wrap:wrap}
.now{font-size:19px;font-weight:900}
.now.na{font-size:14px;font-weight:700;color:var(--muted)}
.prices .save{margin-top:0;padding:2px 8px;font-size:12px}
.bar{height:6px;background:var(--soft);border-radius:99px;margin-top:8px;overflow:hidden;max-width:360px}
.bar i{display:block;height:100%;background:var(--tc);border-radius:99px}
.sub{font-size:11.5px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub a{text-decoration:underline;text-underline-offset:2px}
.row2{display:flex;gap:10px;font-size:12px;color:var(--muted);margin-top:7px;flex-wrap:wrap}
.b{font-weight:700}.hot{color:var(--t1)}.rec{color:var(--accent)}
.aiv{display:flex;gap:6px;align-items:baseline;margin-top:7px;font-size:13px;line-height:1.45}
.aiv .v{flex:0 0 auto;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}
.aiv.top .v{background:linear-gradient(90deg,#7b2ff7,#e5262b);color:#fff}
.aiv.good .v{background:var(--t3bg);color:var(--t3)}
.aiv.bad .v{background:var(--t4bg);color:var(--t4)}
.aiv .r{color:var(--text)}
.deal.top{border:2px solid #7b2ff7}
.hcard.top{border-color:#7b2ff7}
.hreason{font-size:13px;margin-top:8px;line-height:1.45}
.tips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tips span{font-size:12px;font-weight:600;padding:3px 9px;border-radius:7px;background:#fff7d6;color:#7a5a00}
.tips span.unit{background:var(--t3bg);color:var(--t3)}
.tips span.warn{background:var(--t1bg);color:var(--t1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tips span:not(.unit):not(.warn){background:#3a3112;color:#f5d36b}}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;font-weight:700;margin:14px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.empty{text-align:center;color:var(--muted);padding:40px}
.sec{font-size:15px;font-weight:800;margin:0 0 12px}
footer{padding:0 16px 30px;font-size:12px;color:var(--muted);line-height:1.6}

.t1{--tc:var(--t1);--tbg:var(--t1bg)}.t2{--tc:var(--t2);--tbg:var(--t2bg)}
.t3{--tc:var(--t3);--tbg:var(--t3bg)}.t4{--tc:var(--t4);--tbg:var(--t4bg)}

@media (max-width:600px){
  header{padding:10px 16px}
  #fbtn{display:block}
  .adv{display:none}
  header.open .adv{display:flex}
  header.open .chips.adv{display:flex}
  .filters .adv{flex:1 1 45%}
  input[type=number]{width:auto}
  .deal{gap:10px;padding:10px}
  .badge{flex-basis:62px}.badge .p{font-size:20px}
  .hpct{font-size:46px}
  .row1{flex-wrap:wrap}
}
</style>
</head>
<body>
<header id="hd">
  <div class="wrap">
    <div class="top"><h1>꿀딜 피드</h1><span class="meta" id="meta">불러오는 중…</span>
      <a class="tgbtn" href="https://t.me/Pompoobot?start=web" target="_blank" rel="noopener" title="텔레그램으로 알림 받기">📲 <span>알림 받기</span></a></div>
    <div class="filters">
      <input type="search" id="q" placeholder="검색 (예: 휴지, 생수, 에어팟)">
      <button id="fbtn" type="button" aria-expanded="false">필터 ▾</button>
      <select id="mall" class="adv"><option value="">전체 쇼핑몰</option></select>
      <input type="number" id="maxPrice" class="adv" placeholder="최대 가격(원)" step="1000">
      <select id="sort" class="adv">
        <option value="new">최신순</option>
        <option value="ai">AI 추천순</option>
        <option value="dn">할인율 큰 순</option>
        <option value="save">절약 금액 큰 순</option>
        <option value="hot">조회 급상승순</option>
        <option value="rec">추천순</option>
        <option value="cheap">낮은 가격순</option>
      </select>
      <label class="tog adv"><input type="checkbox" id="onlyCheap"> 다나와보다 싼 딜만</label>
    </div>
    <div class="chips adv" id="cats"></div>
  </div>
</header>
<main class="wrap">
  <div class="subcard" id="subcard" hidden>
    <div class="ic">📲</div>
    <div class="tx"><b>진짜 싼 딜만 텔레그램으로 받아보세요</b>
      다나와보다 확실히 싸거나 AI가 강력추천한 딜만 골라 보내드려요. 밤 11시~아침 7시엔 모아서 한 번에.
      <ol class="steps"><li>아래 버튼 → 텔레그램에서 <b style="display:inline;font-size:13px">시작</b> 누르기</li><li>끝! 그만 받으려면 봇에게 /stop</li></ol>
      <span id="subcount"></span></div>
    <a class="tgbtn" href="https://t.me/Pompoobot?start=web" target="_blank" rel="noopener">📲 <span style="display:inline">텔레그램으로 받기</span></a>
    <button class="x" id="subclose" aria-label="닫기">✕</button>
  </div>
  <details class="ainfo" id="ainfo" hidden></details>
  <section class="hero" id="hero"></section>
  <div class="sec" id="listTitle">전체 딜</div>
  <div id="list"></div>
</main>
<footer class="wrap">뽐뿌게시판 RSS 기반 개인용 피드 · 최근 3일 · 할인율은 <b>다나와 최저가</b> 대비이며 상품명 자동 매칭이라 구성이 다를 수 있습니다. 카드의 "비교" 상품명을 확인하고, 원문에서 최종 가격을 꼭 확인하세요.</footer>
<script>
const $ = id => document.getElementById(id);
let all = [], category = '';
const won = n => n == null ? '' : n === 0 ? '무료' : n.toLocaleString('ko-KR') + '원';
const ago = iso => { const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000)); return m < 60 ? `${m}분 전` : m < 1440 ? `${Math.floor(m/60)}시간 전` : `${Math.floor(m/1440)}일 전`; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// 지난 방문 시각 (이 브라우저에만 저장). 저장소를 못 쓰는 환경이면 구분선 없이 동작
let prevVisit = null;
try {
  const v = Number(localStorage.getItem('df:lastVisit'));
  if (v > 0) prevVisit = v;
  localStorage.setItem('df:lastVisit', String(Date.now()));
} catch {}
const isNew = d => prevVisit != null && new Date(d.posted_at).getTime() > prevVisit;

// 할인 등급: 다나와 최저가 대비
const off = d => d.danawa ? -d.danawa.diffPct : null;              // 양수 = 싸다
const saved = d => d.danawa ? d.danawa.price - d.price : null;
function tier(d) {
  const o = off(d);
  if (o == null) return null;
  if (o >= 40) return { cls: 't1', label: '역대급' };
  if (o >= 20) return { cls: 't2', label: '대박' };
  if (o >= 10) return { cls: 't3', label: '싸다' };
  if (o >= -5) return { cls: 't4', label: '비슷' };
  return { cls: 't4', label: '비쌈' };
}

const SORT = {
  new: (a, b) => b.posted_at.localeCompare(a.posted_at),
  ai: (a, b) => (b.ai?.score ?? -1) - (a.ai?.score ?? -1) || (off(b) ?? -999) - (off(a) ?? -999),
  dn: (a, b) => (off(b) ?? -999) - (off(a) ?? -999),
  save: (a, b) => (saved(b) ?? -1e12) - (saved(a) ?? -1e12),
  hot: (a, b) => b.views_per_min - a.views_per_min,
  rec: (a, b) => b.recommend - a.recommend || b.views_per_min - a.views_per_min,
  cheap: (a, b) => (a.price ?? Infinity) - (b.price ?? Infinity),
};

// ===== 알림 설정: 보기 + 웹에서 수정 (GitHub API로 settings.json 직접 커밋) =====
const REPO = 'realseoyt-create/deal-feed';
const CATS = ['생활용품', '식품', '디지털/가전', '패션/뷰티', '상품권/쿠폰', '여행', '기타'];
let cfg = null, cfgSha = null;
const getTok = () => { try { return localStorage.getItem('df:ghToken') || ''; } catch { return ''; } };
const setTok = v => { try { v ? localStorage.setItem('df:ghToken', v) : localStorage.removeItem('df:ghToken'); } catch {} };
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, '')), c => c.charCodeAt(0)));
const b64enc = s => { const b = new TextEncoder().encode(s); let x = ''; b.forEach(c => x += String.fromCharCode(c)); return btoa(x); };

async function fetchSettings() {
  const h = getTok() ? { Authorization: `Bearer ${getTok()}` } : {};
  const r = await fetch(`https://api.github.com/repos/${REPO}/contents/settings.json?ref=main&t=${Date.now()}`, { headers: h, cache: 'no-store' });
  if (!r.ok) throw new Error(`설정 불러오기 실패 (${r.status})`);
  const j = await r.json();
  cfgSha = j.sha;
  return JSON.parse(b64dec(j.content));
}

async function saveSettings(next) {
  const tok = getTok();
  if (!tok) throw new Error('먼저 아래에 GitHub 토큰을 저장해 주세요');
  const put = () => fetch(`https://api.github.com/repos/${REPO}/contents/settings.json`, {
    method: 'PUT',
    headers: { Authorization: `Bearer ${tok}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: 'settings: 웹에서 알림 조건 변경', content: b64enc(JSON.stringify(next, null, 2) + '\n'), sha: cfgSha, branch: 'main' }),
  });
  let r = await put();
  if (r.status === 409 || r.status === 422) { await fetchSettings(); r = await put(); } // 그 사이 봇이 바꿨으면 최신 sha로 재시도
  if (r.status === 401 || r.status === 403) throw new Error('토큰 권한이 없어요 (Contents: Read and write 필요)');
  if (!r.ok) throw new Error(`저장 실패 (${r.status})`);
  cfgSha = (await r.json()).content.sha;
}

const splitList = v => [...new Set(v.split(/[,，\n]/).map(s => s.trim()).filter(Boolean))];

function renderSettings(s) {
  const el = $('ainfo');
  const a = s?.alerts ?? {}, q = s?.quietHours;
  const tags = arr => (arr ?? []).map(k => `<span class="tag">${esc(k)}</span>`).join('') || '없음';
  const tok = getTok();
  el.hidden = false;
  el.innerHTML = `<summary>🔔 텔레그램 알림 조건 · 웹에서 바꾸기</summary>
    <div class="kv">
      <div><b>키워드</b> ${tags(a.keywords)}</div>
      <div><b>관심 카테고리</b> ${tags(a.categories)} ${a.maxPrice ? `· ${won(a.maxPrice)} 이하` : ''} · 다나와보다 ${a.minDiscountPct ?? 10}% 이상 쌀 때</div>
      <div><b>반응</b> 추천 ${a.hotRecommend ?? 3}개 이상 · 조회 속도 상위 ${a.hotTopPercent ?? 10}% · 🏆 AI 강력추천은 항상</div>
      <div><b>제외어</b> ${tags(a.excludeKeywords)}</div>
      <div><b>방해 금지</b> ${q ? `${q.start}시~${q.end}시 (끝나면 모아서 발송)` : '꺼짐'}</div>
    </div>
    <form class="sform" id="sform">
      <div class="f"><label class="t" for="s_kw">관심 키워드</label>
        <input type="text" id="s_kw" value="${esc((a.keywords ?? []).join(', '))}" placeholder="휴지, 생수, 세제">
        <span class="hint">쉼표로 구분 · 제목에 들어 있으면 알림 (다나와보다 비싸지 않을 때)</span></div>
      <div class="f"><span class="t">관심 카테고리</span>
        <div class="catpick">${CATS.map(c => `<label><input type="checkbox" name="s_cat" value="${esc(c)}" ${(a.categories ?? []).includes(c) ? 'checked' : ''}> ${esc(c)}</label>`).join('')}</div></div>
      <div class="f"><span class="t">카테고리 조건</span>
        <div class="row"><input type="number" id="s_max" value="${a.maxPrice ?? ''}" step="1000" min="0" style="width:130px"> 원 이하이고, 다나와보다
          <input type="number" id="s_min" value="${a.minDiscountPct ?? 10}" min="0" max="90"> % 이상 쌀 때</div></div>
      <div class="f"><span class="t">반응 조건</span>
        <div class="row">추천 <input type="number" id="s_rec" value="${a.hotRecommend ?? 3}" min="1" max="50"> 개 이상 · 조회 속도 상위
          <input type="number" id="s_top" value="${a.hotTopPercent ?? 10}" min="1" max="50"> %</div></div>
      <div class="f"><label class="t" for="s_ex">제외어</label>
        <input type="text" id="s_ex" value="${esc((a.excludeKeywords ?? []).join(', '))}" placeholder="종료, 품절"></div>
      <div class="f"><span class="t">방해 금지</span>
        <div class="row"><label class="tog"><input type="checkbox" id="s_qon" ${q ? 'checked' : ''}> 사용</label>
          <input type="number" id="s_qs" value="${q?.start ?? 23}" min="0" max="23"> 시 ~
          <input type="number" id="s_qe" value="${q?.end ?? 7}" min="0" max="23"> 시</div></div>
      <div class="row"><button class="btn primary" type="submit" ${tok ? '' : 'disabled'}>저장</button>
        <span class="smsg" id="smsg">${tok ? '저장하면 다음 수집(10~20분 내)부터 적용' : '저장하려면 아래에 토큰을 먼저 연결하세요'}</span></div>
      <div class="f tokbox"><span class="t">GitHub 토큰 ${tok ? '✅ 연결됨' : ''}</span>
        <span class="hint">이 브라우저에만 저장됩니다. <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">토큰 만들기</a> → Repository access: <b>deal-feed만</b> → Permissions: <b>Contents: Read and write</b></span>
        <div class="row"><input type="password" id="s_tok" placeholder="${tok ? '연결됨 (바꾸려면 새로 입력)' : 'github_pat_...'}" style="flex:1;min-width:200px">
          <button class="btn" type="button" id="s_toksave">토큰 저장</button>
          ${tok ? '<button class="btn" type="button" id="s_tokdel">연결 해제</button>' : ''}</div>
      </div>
      <div class="hint">텔레그램 봇에 <code>/help</code>로도 바꿀 수 있어요 · <a href="https://t.me/Pompoobot" target="_blank" rel="noopener">@Pompoobot</a></div>
    </form>`;

  $('s_toksave').onclick = () => { const v = $('s_tok').value.trim(); if (!v) return; setTok(v); renderSettings(cfg); $('ainfo').open = true; };
  if ($('s_tokdel')) $('s_tokdel').onclick = () => { setTok(''); renderSettings(cfg); $('ainfo').open = true; };
  $('sform').onsubmit = async e => {
    e.preventDefault();
    const msg = $('smsg'); msg.className = 'smsg'; msg.textContent = '저장 중…';
    const num = (id, d) => { const n = Number($(id).value); return Number.isFinite(n) && $(id).value !== '' ? n : d; };
    try {
      const latest = await fetchSettings(); // 봇이 바꾼 다른 값 보존
      latest.alerts = {
        ...latest.alerts,
        keywords: splitList($('s_kw').value),
        categories: [...document.querySelectorAll('input[name=s_cat]:checked')].map(x => x.value),
        maxPrice: num('s_max', null),
        minDiscountPct: Math.min(90, Math.max(0, num('s_min', 10))),
        hotRecommend: Math.max(1, num('s_rec', 3)),
        hotTopPercent: Math.min(50, Math.max(1, num('s_top', 10))),
        excludeKeywords: splitList($('s_ex').value),
      };
      if ($('s_qon').checked) {
        const st = num('s_qs', 23), en = num('s_qe', 7);
        if (st === en || st < 0 || st > 23 || en < 0 || en > 23) throw new Error('방해 금지 시각을 0~23, 서로 다르게 입력하세요');
        latest.quietHours = { start: st, end: en };
      } else delete latest.quietHours;
      await saveSettings(latest);
      cfg = latest; renderSettings(cfg); $('ainfo').open = true;
      $('smsg').className = 'smsg ok'; $('smsg').textContent = '✅ 저장됨 · 다음 수집(10~20분 내)부터 적용';
    } catch (err) { msg.className = 'smsg err'; msg.textContent = err.message; }
  };
}

async function loadSettings(fallback) {
  try { cfg = await fetchSettings(); } catch { cfg = fallback ?? null; }
  if (cfg) renderSettings(cfg);
}

// 본문에서 AI가 뽑은 "싸게 사는 포인트" (원문은 링크에서)
const tipsLine = d => {
  const t = d.tips;
  if (!t || !(t.points?.length || t.unit || t.caution)) return '';
  return `<div class="tips">${(t.points ?? []).map(p => `<span>💡 ${esc(p)}</span>`).join('')}${t.unit ? `<span class="unit">${esc(t.unit)}</span>` : ''}${t.caution ? `<span class="warn">⚠️ ${esc(t.caution)}</span>` : ''}</div>`;
};

const aiLine = d => {
  if (!d.ai) return '';
  const cls = { '강력추천': 'top', '추천': 'good', '비추천': 'bad' }[d.ai.verdict] ?? '';
  return `<div class="aiv ${cls}"><span class="v">${d.ai.verdict === '강력추천' ? '🏆 ' : '🤖 '}${esc(d.ai.verdict)} ${d.ai.score}</span><span class="r">${esc(d.ai.reason)}</span></div>`;
};

function renderHero() {
  const recent = d => Date.now() - new Date(d.posted_at) < 48 * 3600e3;
  // AI 강력추천을 먼저, 남는 자리는 할인율 큰 딜로
  const strong = all.filter(d => recent(d) && d.ai?.verdict === '강력추천' && d.danawa).sort(SORT.ai);
  const cheap = all.filter(d => recent(d) && off(d) >= 10 && !strong.includes(d) && d.ai?.verdict !== '비추천').sort(SORT.dn);
  const top = [...strong, ...cheap].slice(0, 3);
  if (!top.length) {
    // 시세보다 싸다고 확인된 딜이 없을 때: AI가 '추천' 이상 준 딜을 대신 보여줌 (근거 수준을 명시)
    const picks = all.filter(d => recent(d) && ['강력추천', '추천'].includes(d.ai?.verdict)).sort(SORT.ai).slice(0, 3);
    if (!picks.length) { $('hero').innerHTML = ''; return; }
    $('hero').innerHTML = `<h2>🤖 AI 추천 딜</h2>
      <div class="hint" style="font-size:12px;color:var(--muted);margin:-4px 0 10px">지금은 다나와보다 확실히 싸다고 확인된 딜이 없어서, AI가 가격·반응·구매 포인트를 보고 고른 딜을 보여드려요</div>
      <div class="hero-grid">${picks.map(d => `<a class="hcard top" href="${esc(d.url)}" target="_blank" rel="noopener" style="--tc:#7b2ff7;--tbg:var(--soft)">
        <div><span class="hscore">${d.ai.score}<small>점</small></span><span class="htier" style="background:#7b2ff7">${esc(d.ai.verdict)}</span></div>
        <div class="hreason">🤖 ${esc(d.ai.reason)}</div>
        <div class="hname">${esc(d.mall ? `[${d.mall}] ` : '')}${esc(d.product || d.title)}</div>
        <div class="hprice"><b>${won(d.price) || '가격 다양'}</b>${d.danawa ? `<span class="strike">다나와 ${won(d.danawa.price)}</span>` : ''}</div>
        ${tipsLine(d)}
      </a>`).join('')}</div>`;
    return;
  }
  $('hero').innerHTML = `<h2>${strong.length ? '🏆 AI 강력추천 · 지금 가장 싼 딜' : '🔥 지금 가장 싼 딜'}</h2><div class="hero-grid">${top.map(d => {
    const t = tier(d);
    return `<a class="hcard ${t.cls} ${d.ai?.verdict === '강력추천' ? 'top' : ''}" href="${esc(d.url)}" target="_blank" rel="noopener">
      <div><span class="hpct">-${off(d)}<small>%</small></span><span class="htier">${d.ai?.verdict === '강력추천' ? '🏆 강력추천' : t.label}</span></div>
      ${d.ai ? `<div class="hreason">🤖 ${esc(d.ai.reason)}</div>` : ''}
      ${tipsLine(d)}
      <div class="hname">${esc(d.mall ? `[${d.mall}] ` : '')}${esc(d.product || d.title)}</div>
      <div class="hprice"><b>${won(d.price)}</b><span class="strike">다나와 ${won(d.danawa.price)}</span></div>
      <span class="save">${won(saved(d))} 절약</span>${d.hist?.lowest ? ' <span class="save">📉 뽐뿌 역대 최저</span>' : ''}
      <div class="hcmp">비교: ${esc(d.danawa.name)}</div>
    </a>`;
  }).join('')}</div>`;
}

function renderChips() {
  const cnt = {}; all.forEach(d => cnt[d.category] = (cnt[d.category] || 0) + 1);
  $('cats').innerHTML = [`<span class="chip ${category===''?'on':''}" data-c="">전체 ${all.length}</span>`]
    .concat(Object.entries(cnt).sort((a, b) => b[1] - a[1]).map(([c, n]) => `<span class="chip ${category===c?'on':''}" data-c="${esc(c)}">${esc(c)} ${n}</span>`)).join('');
  const malls = {}; all.forEach(d => d.mall && (malls[d.mall] = (malls[d.mall] || 0) + 1));
  const cur = $('mall').value;
  $('mall').innerHTML = '<option value="">전체 쇼핑몰</option>' + Object.entries(malls).sort((a, b) => b[1] - a[1]).slice(0, 40)
    .map(([m]) => `<option ${m===cur?'selected':''}>${esc(m)}</option>`).join('');
}

function card(d) {
  const t = tier(d);
  // 비교된 딜만 배지 표시 (미비교 딜은 배지 자리 없음)
  const badge = t
    ? `<div class="badge"><span class="p">${off(d) > 0 ? '-' + off(d) + '%' : off(d) === 0 ? '0%' : '+' + (-off(d)) + '%'}</span><span class="l">${t.label}</span></div>`
    : '';
  let prices = d.price != null
    ? `<span class="now">${won(d.price)}</span>`
    : `<span class="now na">${/다양|상이|별도|각/.test(d.title) ? '가격 다양 (원문 확인)' : '가격 미상'}</span>`;
  let extra = '';
  if (d.danawa) {
    prices += `<span class="strike">다나와 ${won(d.danawa.price)}</span>`;
    if (saved(d) > 0) prices += `<span class="save">${won(saved(d))} 절약</span>`;
    const pct = Math.max(3, Math.min(100, d.price / d.danawa.price * 100));
    const note = [d.danawa.ratio && d.danawa.ratio !== 1 ? `수량 ×${d.danawa.ratio} 환산` : '', d.danawa.by === 'ai' ? 'AI 확인' : ''].filter(Boolean).join(' · ');
    extra += `<div class="bar"><i style="width:${pct}%"></i></div>
      <div class="sub">비교: <a href="${esc(d.danawa.url)}" target="_blank" rel="noopener">${esc(d.danawa.name)}</a>${note ? ` · ${note}` : ''}</div>`;
  }
  if (d.hist) {
    if (d.hist.lowest) prices += `<span class="save t1">📉 뽐뿌 역대 최저</span>`;
    extra += `<div class="sub">뽐뿌 이전 최저 ${won(d.hist.prevMin)} · ${d.hist.count}회 등장</div>`;
  }
  extra += tipsLine(d) + aiLine(d);
  return `<div class="deal ${t ? 'has ' + t.cls : ''} ${isNew(d) ? 'new' : ''} ${d.ai?.verdict === '강력추천' ? 'top' : ''}">
    ${badge}
    <div class="body">
      <div class="row1"><span class="mall">${esc(d.mall ?? '')}</span><a class="prod" href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.product || d.title)}</a></div>
      <div class="prices">${prices}</div>
      ${extra}
      <div class="row2">
        ${d.alert ? `<span class="b rec">🔔 ${esc(d.alert)}</span>` : ''}
        ${d.views_per_min >= 20 ? `<span class="b hot">🔥 ${d.views_per_min}/분</span>` : ''}
        ${d.recommend > 0 ? `<span class="b rec">👍 ${d.recommend}</span>` : ''}
        <span>조회 ${d.views}</span><span>${esc(d.category)}</span>${d.shipping ? `<span>배송 ${esc(d.shipping)}</span>` : ''}<span>${ago(d.posted_at)}</span>
      </div>
    </div>
  </div>`;
}

function render() {
  const q = $('q').value.trim().toLowerCase(), mall = $('mall').value, max = Number($('maxPrice').value) || null, only = $('onlyCheap').checked;
  const sort = $('sort').value;
  const list = all.filter(d =>
    (!q || d.title.toLowerCase().includes(q)) && (!category || d.category === category) && (!mall || d.mall === mall) &&
    (!max || (d.price != null && d.price <= max)) && (!only || off(d) >= 5)
  ).sort(SORT[sort]).slice(0, 300);
  $('listTitle').textContent = `${only ? '다나와보다 싼 딜' : '전체 딜'} ${list.length}`;
  if (!list.length) { $('list').innerHTML = '<div class="empty">조건에 맞는 딜이 없습니다</div>'; return; }
  // 최신순일 때만: 지난 방문 이후 올라온 딜과 이전 딜 사이에 구분선
  const nNew = sort === 'new' ? list.filter(isNew).length : 0;
  let html = '';
  list.forEach((d, i) => {
    if (nNew && nNew < list.length && i === nNew) html += `<div class="divider">여기부터 지난번에 본 딜</div>`;
    html += card(d);
  });
  $('list').innerHTML = html;
}

async function load() {
  try {
    const data = await (await fetch('deals.json?t=' + Date.now())).json();
    all = data.deals;
    const nNew = all.filter(isNew).length;
    $('meta').innerHTML = `${nNew ? `<b>새 딜 ${nNew}건</b> · ` : ''}${data.updatedAt ? `업데이트 ${ago(data.updatedAt)}` : ''}`;
    // 구독 안내 카드 (닫으면 이 브라우저에선 다시 안 보임)
    let closed = false; try { closed = localStorage.getItem('df:subClosed') === '1'; } catch {}
    $('subcard').hidden = closed;
    if (data.subscriberCount) $('subcount').textContent = `지금 ${data.subscriberCount + 1}명이 받고 있어요`;
    // 설정 폼은 처음 한 번만 그림 (5분 자동 새로고침 때 입력 중인 내용이 날아가지 않게)
    if (!cfg) loadSettings(data.settings);
    renderHero(); renderChips(); render();
  } catch (e) { $('meta').textContent = '데이터를 불러오지 못했습니다'; }
}

let t; const deb = () => { clearTimeout(t); t = setTimeout(render, 200); };
$('q').addEventListener('input', deb);
$('maxPrice').addEventListener('input', deb);
['mall', 'sort', 'onlyCheap'].forEach(id => $(id).addEventListener('change', render));
$('cats').addEventListener('click', e => { const c = e.target.closest('.chip'); if (!c) return; category = c.dataset.c; renderChips(); render(); });
$('subclose').addEventListener('click', () => { $('subcard').hidden = true; try { localStorage.setItem('df:subClosed', '1'); } catch {} });
$('fbtn').addEventListener('click', () => {
  const open = $('hd').classList.toggle('open');
  $('fbtn').textContent = open ? '필터 ▴' : '필터 ▾';
  $('fbtn').setAttribute('aria-expanded', open);
});
load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
